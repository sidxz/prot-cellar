name: Publish Images

on:
  push:
    branches: [main]
    tags:
      - 'backend-v*.*.*'
      - 'frontend-v*.*.*'

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.ref_type == 'branch'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
      - id: decide
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            case "$REF_NAME" in
              backend-v*)  echo "backend=true"  >> "$GITHUB_OUTPUT"; echo "frontend=false" >> "$GITHUB_OUTPUT" ;;
              frontend-v*) echo "backend=false" >> "$GITHUB_OUTPUT"; echo "frontend=true"  >> "$GITHUB_OUTPUT" ;;
              *)           echo "backend=false" >> "$GITHUB_OUTPUT"; echo "frontend=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "backend=$FILTER_BACKEND" >> "$GITHUB_OUTPUT"
            echo "frontend=$FILTER_FRONTEND" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Build & push backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history + tags so `git describe` works on non-tag builds
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        # Single source of build identity (also what `make dev` exports).
        run: scripts/build-info.sh backend | awk -F= -v OFS== '{$1=tolower($1)}1' >> "$GITHUB_OUTPUT"
      # Exact version on every tag; floating X.Y / X only for stable (no -prerelease).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sidxz/prot-cellar-backend
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?,group=0
            type=match,pattern=-v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=-v(\d+)\.\d+\.\d+$,group=1
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_GIT_SHA=${{ steps.ver.outputs.git_sha }}
            APP_BUILD_DATE=${{ steps.ver.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Build & push frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        # Single source of build identity (also what `make dev` exports).
        run: scripts/build-info.sh frontend | awk -F= -v OFS== '{$1=tolower($1)}1' >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sidxz/prot-cellar-frontend
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?,group=0
            type=match,pattern=-v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=-v(\d+)\.\d+\.\d+$,group=1
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_GIT_SHA=${{ steps.ver.outputs.git_sha }}
            APP_BUILD_DATE=${{ steps.ver.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  release:
    name: Publish GitHub Release
    needs: [backend, frontend]
    if: ${{ always() && github.ref_type == 'tag' && (needs.backend.result == 'success' || needs.frontend.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: range
        run: |
          NS="${GITHUB_REF_NAME%%-v*}"                       # backend | frontend
          # Previous *stable* same-namespace tag by creation date (assumes tags are created in
          # version order); pre-release tags are skipped so a release lists everything since the
          # last real one.
          PREV="$(git tag --list "${NS}-v*" --sort=-creatordate \
            | grep -E "^${NS}-v[0-9]+\.[0-9]+\.[0-9]+$" | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)"
          # git-cliff takes a range, not a bare tag; with no previous tag, no
          # range = all history up to this (checked-out) tag.
          if [ -n "$PREV" ]; then
            echo "range=${PREV}..${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "range=" >> "$GITHUB_OUTPUT"
          fi
          echo "path=${NS}/**" >> "$GITHUB_OUTPUT"
          case "${GITHUB_REF_NAME#"${NS}"-v}" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;   # e.g. 0.1.0-beta.1
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # Title-case the namespace: "backend" -> "Backend".
          TITLE="$(printf '%s' "$NS" | sed 's/^./\U&/') ${GITHUB_REF_NAME#"${NS}"-}"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
      - uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --include-path "${{ steps.range.outputs.path }}" ${{ steps.range.outputs.range }}
        env:
          OUTPUT: CHANGES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.range.outputs.title }}
          body_path: ${{ steps.cliff.outputs.changelog }}
          prerelease: ${{ steps.range.outputs.prerelease }}
