services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: protcellar
      POSTGRES_PASSWORD: protcellar
      POSTGRES_DB: protcellar
    ports:
      - "5433:5432"
    volumes:
      - protcellar_pg:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
volumes:
  protcellar_pg:
