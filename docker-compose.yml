services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: protcellar
      POSTGRES_PASSWORD: protcellar
      POSTGRES_DB: protcellar
    ports:
      # Loopback-only: reachable from the host (uv/tests) but not the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - protcellar_pg:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
volumes:
  protcellar_pg:
