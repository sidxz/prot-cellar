<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- protcellar — α-helix mark, sibling to docu-store's "cited compound".
       One continuous coil (bold ~300° loops) with faint threads passing behind
       through the gaps: a protein helix, not stacked rings. The strand carries
       the shared brand gradient; self-colored, so it reads on any background. -->
  <defs>
    <linearGradient id="p" gradientUnits="userSpaceOnUse" x1="6" y1="24" x2="28" y2="6">
      <stop offset="0" stop-color="#37d7fa"/>
      <stop offset=".4" stop-color="#4b72fe"/>
      <stop offset=".68" stop-color="#ff8df2"/>
      <stop offset="1" stop-color="#ff8705"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#p)" stroke-linecap="round">
    <path d="M13 5.7 L19 10.7 M13 10.7 L19 15.7 M13 15.7 L19 20.7" stroke-width="1.4" opacity=".4"/>
    <path d="M19 5.7 A6 3 0 1 1 13 5.7 M19 10.7 A6 3 0 1 1 13 10.7 M19 15.7 A6 3 0 1 1 13 15.7 M19 20.7 A6 3 0 1 1 13 20.7" stroke-width="2"/>
  </g>
</svg>
